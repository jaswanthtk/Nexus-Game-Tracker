<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nexus — Your ultimate gaming backlog and telemetry tracker. Organize, discover, and conquer your games." />
  <meta name="theme-color" content="#09090b" />
  <title>Nexus — Analytics</title>
  
  <!-- SEO & Performance Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="favicon.svg" />
  <!-- Keep bootstrap for modal functionality -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: { 400: '#74c7ec', 500: '#89b4fa', 900: '#181825' },
            accent: { 400: '#cba6f7', 500: '#b4befe' }
          }
        }
      }
    }
  </script>
  
  <!-- Motion (Vanilla) & Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>

  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen flex flex-col font-sans antialiased selection:bg-accent-500/30">
  <nav class="navbar navbar-expand-lg sticky top-0 z-50 bg-zinc-950/80  border-b border-zinc-800 shadow-lg py-3">
    <div class="container-xl">
      <a class="navbar-brand text-2xl font-display font-bold text-white flex items-center gap-2 hover:text-accent-400 transition-colors" href="admin.html" aria-label="Nexus Admin">
        <i data-lucide="shield" class="text-accent-500 w-8 h-8 fill-accent-500/20"></i> Nexus 
        <span class="bg-accent-500/20 text-accent-400 text-[0.6rem] px-2 py-1 rounded border border-accent-500/30 font-mono tracking-widest uppercase">Admin</span>
      </a>
      <button class="navbar-toggler border-0 shadow-none focus:ring-0 lg:hidden p-1" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="Toggle navigation">
        <i data-lucide="menu" class="w-7 h-7 text-zinc-300"></i>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
          <li class="nav-item"><a class="nav-link font-medium !text-zinc-400 hover:!text-white transition-colors" href="admin.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link font-medium !text-zinc-400 hover:!text-white transition-colors" href="admin_games.html">Manage Games</a></li>
          <li class="nav-item"><a class="nav-link font-medium !text-zinc-400 hover:!text-white transition-colors" href="admin_users.html">User Moderation</a></li>
          <li class="nav-item"><a class="nav-link active font-medium !text-accent-400" aria-current="page" href="admin_analytics.html">Analytics</a></li>
          <li class="nav-item"><a class="nav-link font-medium !text-zinc-400 hover:!text-white transition-colors" href="admin_feedback.html">Inbox</a></li>
          <li class="nav-item"><a class="nav-link font-medium !text-zinc-400 hover:!text-white transition-colors" href="admin_logs.html">Audit Logs</a></li>
          <li class="nav-item"><a class="nav-link font-medium !text-zinc-400 hover:!text-white transition-colors" href="admin_settings.html">Site Settings</a></li>
        </ul>
        <ul class="navbar-nav align-items-center gap-4">
          <li class="nav-item"><a class="nav-link flex items-center gap-2 text-red-400 hover:text-red-300 font-medium transition-colors" id="nav-logout-btn" href="#" onclick="logoutUser(event)"><i data-lucide="log-out" class="w-5 h-5"></i>Logout</a></li>
          <li class="nav-item"><a class="nav-link flex items-center gap-2 text-brand-400 hover:text-brand-300 font-medium transition-colors" href="catalog.html"><i data-lucide="external-link" class="w-5 h-5"></i>View Site</a></li>
          <li class="nav-item">
            <button class="p-2 rounded-full bg-zinc-900/50 hover:bg-zinc-800 text-zinc-400 hover:text-brand-400 transition-colors border border-zinc-800/50" id="theme-toggle" aria-label="Toggle Light/Dark Theme">
              <i data-lucide="moon" class="w-5 h-5" id="theme-icon"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
<main class="py-12 flex-grow" id="main"><div class="container-xl"><h1 class="text-4xl font-display font-bold text-accent-400 mb-8">Telemetry & Analytics</h1><div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-6"><div class="row g-4 mb-4"><div class="col-md-4"><div class="card bg-dark text-white p-3 border-secondary"><div>Played</div><div id="analytics-played" class="fs-2 text-success">--</div></div></div><div class="col-md-4"><div class="card bg-dark text-white p-3 border-secondary"><div>Backlog</div><div id="analytics-backlog" class="fs-2 text-warning">--</div></div></div><div class="col-md-4"><div class="card bg-dark text-white p-3 border-secondary"><div>Upcoming</div><div id="analytics-upcoming" class="fs-2 text-primary">--</div></div></div></div><div class="row g-4"><div class="col-md-6"><h3 class="text-info fs-5 mb-3">Genre Distribution</h3><div id="analytics-genres"></div></div><div class="col-md-6"><h3 class="text-info fs-5 mb-3">Platform Breakdown</h3><div id="analytics-platforms"></div></div></div></div></div></main>
  <footer class="mt-auto py-8 text-center text-zinc-500 border-t border-zinc-800/50">
    <div class="container-xl">
      <p class="mb-0 font-display font-medium tracking-wide"><strong>NEXUS</strong> &mdash; V3 Premium UI &bull; Agentic Build</p>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-4 z-[1100]">
    <div id="app-toast" class="toast align-items-center text-white bg-zinc-900/90  border border-zinc-800 shadow-2xl rounded-xl" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex p-1">
        <div class="toast-body flex items-center text-sm font-medium">
          <i data-lucide="check-circle" class="w-5 h-5 mr-3 text-brand-400" id="toast-icon"></i>
          <span id="toast-text">Action completed.</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- Initialize Lucide Icons -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
  <script src="js/admin.js?v=4"></script>
</body>
</html>
