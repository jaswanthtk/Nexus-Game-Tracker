<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nexus — Elite Terminal for Game Tracking" />
  <title>Nexus — Library</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="atmospheric-bg atmospheric-bg-layer1"></div>
  <nav class="navbar navbar-expand-lg nexus-navbar">
    <div class="container-xl">
      <a class="navbar-brand" href="catalog.html">Nexus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#clientNav" aria-controls="clientNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="clientNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
          <li class="nav-item"><a class="nav-link" href="client_search.html">Game Search</a></li>
          <li class="nav-item"><a class="nav-link" href="client_profile.html">User Profile</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="client_logbook.html">Library</a></li>
          <li class="nav-item"><a class="nav-link" href="client_contact.html">Contact/Support</a></li>
        </ul>
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link text-amber" id="nav-login-btn" href="login.html"><i class="bi bi-person-circle me-1"></i><span id="nav-login-text">Login</span></a></li>
          <li class="nav-item">
            <button class="theme-switcher" id="theme-toggle" aria-label="Toggle Theme">
              <i class="bi bi-moon-stars-fill"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5" id="main" role="main">
    <div class="container-xl">
      <h2 class="rajdhani-font text-cyan mb-4">Personal Vault</h2>
<div class="row g-4" id="kanban-board">

        <!-- PLAYED Lane -->
        <div class="col-12 col-lg-4">
          <section class="kanban-lane" aria-label="Played games">
            <div class="lane-header lane-played">
              <i class="bi bi-check-circle-fill"></i>
              <h2 class="lane-title">Played</h2>
              <span class="lane-badge" id="badge-played">0</span>
            </div>
            <div class="lane-drop-zone" id="lane-played" data-lane="played" role="list" aria-label="Played games list">
              <div class="drop-hint" id="hint-played" aria-hidden="true">
                <i class="bi bi-box-arrow-in-down"></i>
                <span>Drop a game here</span>
              </div>
            </div>
          </section>
        </div>

        <!-- BACKLOG Lane -->
        <div class="col-12 col-lg-4">
          <section class="kanban-lane" aria-label="Backlog games">
            <div class="lane-header lane-backlog">
              <i class="bi bi-clock-fill"></i>
              <h2 class="lane-title">Backlog</h2>
              <span class="lane-badge" id="badge-backlog">0</span>
            </div>
            <div class="lane-drop-zone" id="lane-backlog" data-lane="backlog" role="list" aria-label="Backlog games list">
              <div class="drop-hint" id="hint-backlog" aria-hidden="true">
                <i class="bi bi-box-arrow-in-down"></i>
                <span>Drop a game here</span>
              </div>
            </div>
          </section>
        </div>

        <!-- UPCOMING Lane -->
        <div class="col-12 col-lg-4">
          <section class="kanban-lane" aria-label="Upcoming games">
            <div class="lane-header lane-upcoming">
              <i class="bi bi-calendar-event-fill"></i>
              <h2 class="lane-title">Upcoming</h2>
              <span class="lane-badge" id="badge-upcoming">0</span>
            </div>
            <div class="lane-drop-zone" id="lane-upcoming" data-lane="upcoming" role="list" aria-label="Upcoming games list">
              <div class="drop-hint" id="hint-upcoming" aria-hidden="true">
                <i class="bi bi-box-arrow-in-down"></i>
                <span>Drop a game here</span>
              </div>
            </div>
          </section>
        </div>

      </div>
    </div>
  </main>
  <footer class="site-footer-bottom py-4 text-center text-muted" style="border-top: 1px solid var(--glass-border);">
    <div class="container-xl">
      <p class="mb-0 font-rajdhani"><span>NEXUS</span> &mdash; B.Tech &bull; 01CE0306</p>
    </div>
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div id="app-toast" class="toast glass-toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="bi bi-check-circle-fill me-2 text-cyan" id="toast-icon"></i>
          <span id="toast-text">Action completed.</span>
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
